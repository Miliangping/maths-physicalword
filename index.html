<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>数理词汇 MathLex · 数学 & 物理</title>
<style>
:root{
  --bg:#f7f8fc; --card:#fff; --primary:#4f46e5; --primary-dark:#3730a3;
  --text:#1e1b4b; --muted:#6b7280; --border:#e5e7eb;
  --green:#10b981; --amber:#f59e0b; --red:#ef4444;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;padding:20px 14px 60px;}
#app{max-width:720px;margin:0 auto;}
.hero{text-align:center;margin-bottom:22px;}
.hero h1{font-size:23px;margin:0 0 6px;}
.hero p{color:var(--muted);margin:0;font-size:13px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:14px;}
.card-title{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.btn{border:none;border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer;font-family:inherit;transition:.15s;background:#fff;color:var(--text);border:1px solid var(--border);}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.btn-primary:active{background:var(--primary-dark);}
.btn-ghost{background:#fff;}
.btn-ghost:active{background:#f3f4f6;}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:8px;}
.btn-block{width:100%;display:block;}
.subject-tabs{display:flex;gap:8px;margin-bottom:18px;background:#eef0f6;border-radius:12px;padding:4px;}
.subject-tab{flex:1;text-align:center;padding:10px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted);transition:.15s;border:none;background:transparent;font-family:inherit;}
.subject-tab.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(79,70,229,.12);}
.overview{display:flex;justify-content:space-around;text-align:center;padding:10px 0;}
.overview .num{font-size:22px;font-weight:800;color:var(--primary);}
.overview .num small{font-size:13px;font-weight:500;color:var(--muted);}
.overview .label{font-size:12px;color:var(--muted);margin-top:2px;}
.all-card{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:1px solid #c7d2fe;border-radius:14px;padding:16px 20px;margin-bottom:14px;cursor:pointer;transition:.15s;}
.all-card:active{transform:scale(.99);}
.all-card .icon{font-size:24px;}
.all-card .body{flex:1;}
.all-card .body .t{font-size:15px;font-weight:700;color:var(--primary-dark);}
.all-card .body .s{font-size:12.5px;color:var(--muted);margin-top:2px;}
.all-card .arrow{color:var(--primary);font-size:18px;}
.domain-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.domain-card{background:#fafafe;border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:.15s;}
.domain-card:active{background:#eef2ff;border-color:var(--primary);}
.domain-card .name{font-size:14px;font-weight:600;}
.domain-card .meta{font-size:12px;color:var(--muted);margin-top:4px;}
.progress-bar{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin-top:6px;}
.progress-bar > span{display:block;height:100%;background:var(--primary);border-radius:3px;transition:width .3s;}
.learn-tabs{display:flex;gap:8px;margin-bottom:14px;background:#eef0f6;border-radius:12px;padding:4px;}
.learn-tab{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted);transition:.15s;border:none;background:transparent;font-family:inherit;}
.learn-tab.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(79,70,229,.12);}
.control-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px;color:var(--muted);}
.dir-switch{display:inline-flex;background:#eef0f6;border-radius:8px;padding:3px;gap:2px;}
.dir-btn{border:none;background:transparent;padding:5px 12px;border-radius:6px;font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--muted);font-weight:600;}
.dir-btn.active{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(79,70,229,.15);}

/* ============ 闪卡 3D 翻转 ============ */
.flashcard-wrap{perspective:1200px;margin-bottom:18px;transition:transform .15s ease;}
.flashcard-wrap:active{transform:scale(.985);}
.flashcard{
  display:grid;
  min-height:280px;
  transform-style:preserve-3d;
  -webkit-transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.35,.1,.25,1);
  cursor:pointer;
  will-change:transform;
}
.flashcard.flipped{transform:rotateY(180deg);}
.flashcard .face{
  grid-area:1 / 1;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border:1px solid var(--border);
  border-radius:20px;
  padding:26px 22px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}
.flashcard .front{
  background:var(--card);
  box-shadow:0 4px 16px rgba(30,27,75,.06);
}
.flashcard .back{
  transform:rotateY(180deg);
  -webkit-transform:rotateY(180deg);
  background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);
  border-color:transparent;
  color:#fff;
  box-shadow:0 14px 36px rgba(79,70,229,.38);
}

.big-word{font-size:26px;font-weight:800;color:var(--primary);margin:0;word-break:break-word;line-height:1.3;}
.pos{font-size:13px;color:var(--muted);font-style:italic;margin-top:6px;}
.tap-hint{font-size:12px;color:var(--muted);margin-top:12px;}

/* 背面：蓝色背景上的文字配色 */
.back-term{font-size:22px;font-weight:800;color:#fff;word-break:break-word;line-height:1.3;text-shadow:0 1px 3px rgba(0,0,0,.12);}
.back-pos{font-size:12.5px;color:rgba(255,255,255,.78);font-style:italic;margin:4px 0 8px;}
.back-zh{font-size:18px;font-weight:700;color:#fff;margin-bottom:10px;word-break:break-word;text-shadow:0 1px 3px rgba(0,0,0,.12);}
.flashcard .back .example{font-size:13px;color:rgba(255,255,255,.92);line-height:1.55;max-width:96%;}
.flashcard .back .example em{color:#fef3c7;font-style:normal;font-weight:700;}

.flashcard-actions{display:flex;gap:10px;margin-top:6px;}
.flashcard-actions .btn{flex:1;}
.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 20px;margin-bottom:14px;}
.quiz-prompt{font-size:24px;font-weight:800;color:var(--primary);text-align:center;margin:0 0 4px;word-break:break-word;}
.quiz-hint{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:16px;}
.quiz-option{display:block;width:100%;text-align:left;padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:#fff;margin-bottom:8px;font-size:14px;cursor:pointer;font-family:inherit;transition:.12s;}
.quiz-option:active{background:#f3f4f6;}
.quiz-option.correct{background:#ecfdf5;border-color:var(--green);color:#047857;font-weight:600;}
.quiz-option.wrong{background:#fef2f2;border-color:var(--red);color:#b91c1c;}
.quiz-option:disabled{cursor:default;}
.quiz-input-wrap{display:flex;gap:8px;margin-top:14px;}
.quiz-input{flex:1;padding:13px 16px;border:1px solid var(--border);border-radius:10px;font-size:16px;font-family:inherit;outline:none;background:#fff;}
.quiz-input:focus{border-color:var(--primary);background:#f8faff;}
.quiz-input:disabled{background:#f9fafb;color:var(--muted);}
.feedback{margin-top:14px;font-size:13.5px;}
.feedback .ok{color:var(--green);font-weight:700;}
.feedback .no{color:var(--red);font-weight:700;}
.feedback .exp{color:var(--muted);margin-top:6px;font-size:13px;}
.group-title{font-size:13.5px;font-weight:700;color:var(--primary-dark);margin:16px 0 4px;padding-left:8px;border-left:3px solid var(--primary);}
.word-item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--border);cursor:pointer;}
.word-item:first-of-type{border-top:none;}
.word-num{flex:none;width:26px;font-size:12px;color:var(--muted);text-align:right;}
.word-text{flex:1;font-size:14px;word-break:break-word;}
.word-text .en{font-weight:700;}
.word-text .zh{font-weight:500;color:#4b5563;}
.word-text .sep{color:#d1d5db;margin:0 8px;}
.word-status{flex:none;width:10px;height:10px;border-radius:50%;background:#e5e7eb;}
.word-status.learning{background:var(--amber);}
.word-status.mastered{background:var(--green);}
.tag{display:inline-block;background:#eef2ff;color:var(--primary);border-radius:6px;padding:2px 10px;font-size:12px;}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.topbar .right{margin-left:auto;display:flex;gap:8px;align-items:center;}
</style>
</head>

/* =========================================================

   ========================================================= */
const STATUS = { NEW: 'new', LEARNING: 'learning', MASTERED: 'mastered' };
const STORE_KEY = 'mathphys_lex_v6';
const LIST_MODES = ['en-zh','zh-en','en','zh'];
const LIST_MODE_LABELS = { 'en-zh':'英中','zh-en':'中英','en':'仅英','zh':'仅中' };

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(arr){ const a = arr.slice(); for(let i = a.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function loadProgress(){ try{ const r = localStorage.getItem(STORE_KEY); return r ? JSON.parse(r) : {}; }catch(e){ return {}; } }
function saveProgress(p){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){} }

let progress = loadProgress();
function termKey(mod, dom, term){ return mod+'||'+dom+'||'+term; }
function getStatus(mod, dom, term){ return progress[termKey(mod, dom, term)] || STATUS.NEW; }
function setStatus(mod, dom, term, status){
  const k = termKey(mod, dom, term);
  if(status === STATUS.NEW) delete progress[k]; else progress[k] = status;
  saveProgress(progress);
}
function cycleStatus(mod, dom, term){
  const cur = getStatus(mod, dom, term);
  const next = cur === STATUS.NEW ? STATUS.LEARNING : cur === STATUS.LEARNING ? STATUS.MASTERED : STATUS.NEW;
  setStatus(mod, dom, term, next);
}

function getAllItems(mod, dom){
  if(dom === '__ALL__'){
    const arr = [];
    Object.keys(DATA[mod].domains).forEach(d => {
      DATA[mod].domains[d].forEach(it => arr.push({ mod, dom: d, item: it }));
    });
    return arr;
  }
  return DATA[mod].domains[dom].map(it => ({ mod, dom, item: it }));
}

function zhCandidates(zh){
  return String(zh||'').split(/[；;、\/]/).map(s=>s.trim()).filter(Boolean);
}
function norm(s){
  return String(s == null ? '' : s)
    .replace(/[\uFF01-\uFF5E]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/[''']/g, '')
    .toLowerCase()
    .replace(/[\s,.;:!?，。；：！？、\-]/g, '');
}
function isSpellCorrect(it, dir, input){
  const n = norm(input);
  if(!n) return false;
  if(dir === 'en-zh') return n === norm(it.term);
  return zhCandidates(it.zh).some(z => norm(z) === n);
}

        <div class="face back">
          <div class="back-term">${esc(it.term)}</div>
          ${it.pos ? `<div class="back-pos">${esc(it.pos)}</div>` : ''}
          <div class="back-zh">${esc(it.zh)}</div>
          <div class="example">${it.example}</div>
        </div>
      </div>
    </div>
    <div class="flashcard-actions" id="flashActions" style="display:${state.flipped?'flex':'none'};">
      <button class="btn btn-ghost" id="markLearning" style="flex:1;">还不熟</button>
      <button class="btn btn-primary" id="markMastered" style="flex:1;">已掌握</button>
    </div>
    <div id="skipWrap" style="display:${state.flipped?'none':'block'};text-align:center;margin-top:6px;">
      <button class="btn btn-ghost btn-sm" id="skip">跳过</button>
    </div>
  `;

  const card = wrap.querySelector('#flashcard');
  const actions = wrap.querySelector('#flashActions');
  const skipWrap = wrap.querySelector('#skipWrap');

  // 关键：只 toggle class，不重建 DOM，transition 动画才会生效
  card.onclick = () => {
    state.flipped = !state.flipped;
    card.classList.toggle('flipped', state.flipped);
    actions.style.display = state.flipped ? 'flex' : 'none';
    skipWrap.style.display = state.flipped ? 'none' : 'block';
  };

  wrap.querySelector('#skip').onclick = () => {
    state.qi++; state.flipped = false; renderFlashTab();
  };
  wrap.querySelector('#markLearning').onclick = () => {
    setStatus(cur.mod, cur.dom, it.term, STATUS.LEARNING);
    state.qi++; state.flipped = false; renderFlashTab();
  };
  wrap.querySelector('#markMastered').onclick = () => {
    setStatus(cur.mod, cur.dom, it.term, STATUS.MASTERED);
    state.qi++; state.flipped = false; renderFlashTab();
  };
}

/* =========================================================
   测验
   ========================================================= */
function renderQuizTab(){
  const wrap = document.getElementById('tabContent');
  if(state.qi >= state.queue.length){ wrap.innerHTML = finishBlock('🎉 本套测验已完成'); bindFinish(wrap); return; }
  const cur = state.queue[state.qi], it = cur.item;
  const dir = state.quizDir;

  if(state.quizMode === 'choice'){
    renderChoiceQuestion(wrap, cur, it, dir);
  } else {
    renderSpellQuestion(wrap, cur, it, dir);
  }
}

function pickDistractors(cur, dir, count){
  const pool = [];
  const src1 = DATA[cur.mod].domains[cur.dom];
  src1.forEach(x => { if(x.term !== cur.item.term) pool.push(x); });
  if(pool.length < count){
    Object.keys(DATA[cur.mod].domains).forEach(d => {
      if(d === cur.dom) return;
      DATA[cur.mod].domains[d].forEach(x => {
        if(x.term !== cur.item.term && !pool.some(p => p.term === x.term)) pool.push(x);
      });
    });
  }
  const shuffled = shuffle(pool);
  const picked = [];
  for(const x of shuffled){
    const label = dir === 'en-zh' ? x.zh : x.term;
    if(!picked.some(p => p.label === label)) picked.push({ label, term: x.term, zh: x.zh });
    if(picked.length >= count) break;
  }
  return picked;
}

function renderChoiceQuestion(wrap, cur, it, dir){
  const prompt = dir === 'en-zh' ? it.term : it.zh;
  const correct = dir === 'en-zh' ? it.zh : it.term;
  const distractors = pickDistractors(cur, dir, 3);
  const options = shuffle([{ label: correct, correct: true }, ...distractors.map(d => ({ label: d.label, correct: false }))]);

  wrap.innerHTML = `
    <div style="text-align:right;font-size:12.5px;color:var(--muted);margin-bottom:6px;">${state.qi + 1} / ${state.queue.length}</div>
    <div class="quiz-card">
      <div class="quiz-prompt">${esc(prompt)}</div>
      <div class="quiz-hint">${it.pos ? esc(it.pos) + ' · ' : ''}${dir==='en-zh'?'选择正确的中文释义':'选择正确的英文术语'}</div>
      ${options.map((o, i) => `<button class="quiz-option" data-i="${i}" data-correct="${o.correct?1:0}">${esc(o.label)}</button>`).join('')}
      <div class="feedback" id="quizFeedback"></div>
    </div>
  `;

  wrap.querySelectorAll('.quiz-option').forEach(btn => {
    btn.onclick = () => {
      if(state.quizAnswered) return;
      state.quizAnswered = true;
      const isRight = btn.dataset.correct === '1';

      wrap.querySelectorAll('.quiz-option').forEach(b => {
        b.disabled = true;
        if(b.dataset.correct === '1') b.classList.add('correct');
        else if(b === btn) b.classList.add('wrong');
      });

      const fb = wrap.querySelector('#quizFeedback');
      if(isRight){
        setStatus(cur.mod, cur.dom, it.term, STATUS.MASTERED);
        fb.innerHTML = `<div class="ok">✅ 正确</div><div class="exp">${esc(it.example)}</div>`;
      } else {
        setStatus(cur.mod, cur.dom, it.term, STATUS.LEARNING);
        fb.innerHTML = `<div class="no">❌ 正确答案：${esc(correct)}</div><div class="exp">${esc(it.example)}</div>`;
      }

      setTimeout(() => { state.qi++; state.quizAnswered = false; renderQuizTab(); }, isRight ? 900 : 1800);
    };
  });
}

function renderSpellQuestion(wrap, cur, it, dir){
  const prompt = dir === 'en-zh' ? it.zh : it.term;
  const hint = dir === 'en-zh'
    ? (it.pos ? esc(it.pos) + ' · 请拼写英文术语' : '请拼写英文术语')
    : (it.pos ? esc(it.pos) + ' · 请填写中文释义' : '请填写中文释义');
  const correct = dir === 'en-zh' ? it.term : it.zh;

  wrap.innerHTML = `
    <div style="text-align:right;font-size:12.5px;color:var(--muted);margin-bottom:6px;">${state.qi + 1} / ${state.queue.length}</div>
    <div class="quiz-card">
      <div class="quiz-prompt">${esc(prompt)}</div>
      <div class="quiz-hint">${hint}</div>
      <div class="quiz-input-wrap">
        <input class="quiz-input" id="spellInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${dir==='en-zh'?'输入英文':'输入中文'}">
        <button class="btn btn-primary quiz-submit" id="spellSubmit">提交</button>
      </div>
      <div class="feedback" id="quizFeedback"></div>
    </div>
  `;

  const input = wrap.querySelector('#spellInput');
  const btn = wrap.querySelector('#spellSubmit');
  const fb = wrap.querySelector('#quizFeedback');
  input.focus();

  const submit = () => {
    if(state.quizAnswered) return;
    state.quizAnswered = true;
    const isRight = isSpellCorrect(it, dir, input.value);
    input.disabled = true;
    btn.disabled = true;

    if(isRight){
      setStatus(cur.mod, cur.dom, it.term, STATUS.MASTERED);
      fb.innerHTML = `<div class="ok">✅ 正确：${esc(correct)}</div><div class="exp">${esc(it.example)}</div>`;
    } else {
      setStatus(cur.mod, cur.dom, it.term, STATUS.LEARNING);
      fb.innerHTML = `<div class="no">❌ 正确答案：${esc(correct)}</div><div class="exp">你的输入：${esc(input.value || '（空）')}<br>${esc(it.example)}</div>`;
    }
    setTimeout(() => { state.qi++; state.quizAnswered = false; renderQuizTab(); }, isRight ? 900 : 2200);
  };

  btn.onclick = submit;
  input.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); submit(); } });
}

/* =========================================================
   词表
   ========================================================= */
function renderListTab(){
  const wrap = document.getElementById('tabContent');
  const mod = state.module, dom = state.domain;
  const mode = state.listMode;

  if(dom === '__ALL__'){
    let html = '';
    Object.keys(DATA[mod].domains).forEach(d => {
      const items = DATA[mod].domains[d];
      html += `<div class="group-title">${esc(d)} · ${items.length} 词</div>`;
      html += `<div class="card" style="padding:4px 16px;">${items.map((it, i) => wordRow(mod, d, it, i, mode)).join('')}</div>`;
    });
    wrap.innerHTML = html;
  } else {
    const items = DATA[mod].domains[dom];
    wrap.innerHTML = `<div class="card" style="padding:6px 16px;">${items.map((it, i) => wordRow(mod, dom, it, i, mode)).join('')}</div>`;
  }

  wrap.querySelectorAll('.word-item').forEach(row => {
    row.onclick = () => {
      const m = row.dataset.mod, d = row.dataset.dom, t = row.dataset.term;
      cycleStatus(m, d, t);
      renderListTab();
    };
  });
}

function wordRow(mod, dom, it, i, mode){
  const st = getStatus(mod, dom, it.term);
  return `
    <div class="word-item" data-mod="${escAttr(mod)}" data-dom="${escAttr(dom)}" data-term="${escAttr(it.term)}">
      <span class="word-num">${i + 1}</span>
      <span class="word-text">${renderWordText(it, mode)}</span>
      <span class="word-status ${st}"></span>
    </div>
  `;
}

function renderWordText(it, mode){
  if(mode === 'en-zh') return `<span class="en">${esc(it.term)}</span><span class="sep">·</span><span class="zh">${esc(it.zh)}</span>`;
  if(mode === 'zh-en') return `<span class="en">${esc(it.zh)}</span><span class="sep">·</span><span class="zh">${esc(it.term)}</span>`;
  if(mode === 'en')    return `<span class="en">${esc(it.term)}</span>`;
  return `<span class="en">${esc(it.zh)}</span>`;
}

/* =========================================================
   完成块 & 队列
   ========================================================= */
function finishBlock(msg){
  return `
    <div class="hero" style="margin-top:26px;">
      <h1 style="font-size:20px;">${msg}</h1>
      <p>可以切换其他模式，或返回领域列表。</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto;">
      <button class="btn btn-primary btn-block" id="again">再练一遍</button>
      <button class="btn btn-ghost btn-block" id="toList">查看词表</button>
      <button class="btn btn-ghost btn-block" id="backHome">返回首页</button>
    </div>
  `;
}
function bindFinish(wrap){
  const again = wrap.querySelector('#again');
  if(again) again.onclick = () => { buildQueue(); state.qi = 0; state.flipped = false; state.quizAnswered = false; renderLearn(); };
  const toList = wrap.querySelector('#toList');
  if(toList) toList.onclick = () => { state.tab = 'list'; renderLearn(); };
  const bh = wrap.querySelector('#backHome');
  if(bh) bh.onclick = renderHome;
}

function buildQueue(){
  const mod = state.module, dom = state.domain;
  const list = getAllItems(mod, dom);
  const order = { [STATUS.NEW]: 0, [STATUS.LEARNING]: 1, [STATUS.MASTERED]: 2 };
  state.queue = list.slice().sort((a, b) => {
    return order[getStatus(a.mod, a.dom, a.item.term)] - order[getStatus(b.mod, b.dom, b.item.term)];
  });
}

renderHome();
</script>
